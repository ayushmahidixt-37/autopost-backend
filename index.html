<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoPost AI 🎬</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#080B12;color:#E8EDF5;font-family:'Inter',sans-serif;min-height:100vh}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  ::-webkit-scrollbar{width:3px}
  ::-webkit-scrollbar-thumb{background:#1A2035;border-radius:2px}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .header{position:sticky;top:0;z-index:10;background:rgba(8,11,18,.95);backdrop-filter:blur(14px);border-bottom:1px solid #1A2035;padding:13px 16px;display:flex;align-items:center;gap:12px}
  .chat{flex:1;overflow-y:auto;padding:12px 16px 16px}
  .msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-end}
  .msg.user{flex-direction:row-reverse}
  .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;border:1px solid #1A2035}
  .msg.user .avatar{background:#00E5CC;border-color:#00E5CC}
  .msg.bot .avatar{background:#0F1420}
  .bubble{max-width:78%;padding:10px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap;border:1px solid #1A2035;background:#0F1420;border-radius:16px 16px 16px 4px}
  .msg.user .bubble{background:#00E5CC;color:#080B12;border:none;font-weight:600;border-radius:16px 16px 4px 16px}
  .time{font-size:10px;color:#4A5568;margin-top:3px}
  .msg.user .time{text-align:right}
  .confirm{margin:0 16px 12px;background:#0F1420;border:1px solid #00E5CC44;border-radius:14px;padding:16px;display:none}
  .active-bar{margin:10px 16px 4px;background:rgba(0,229,204,.08);border:1px solid rgba(0,229,204,.2);border-radius:12px;padding:11px 14px;display:none;align-items:center;gap:10px}
  .dot{width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 8px #22C55E;animation:pulse 2s infinite;flex-shrink:0}
  .chips{padding:4px 16px 10px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:#0F1420;border:1px solid #1A2035;border-radius:20px;padding:7px 13px;color:#E8EDF5;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
  .input-bar{padding:12px 16px;border-top:1px solid #1A2035;display:flex;gap:8px;align-items:flex-end;background:rgba(8,11,18,.96);backdrop-filter:blur(12px)}
  .mic{width:44px;height:44px;border-radius:12px;background:#0F1420;border:1px solid #1A2035;color:#E8EDF5;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
  .mic.on{background:#F56565;border-color:#F56565;box-shadow:0 0 14px rgba(245,101,101,.5)}
  textarea{flex:1;resize:none;max-height:90px;background:#0F1420;border:1px solid #1A2035;border-radius:12px;padding:11px 14px;color:#E8EDF5;font-size:14px;outline:none;line-height:1.4;font-family:'Inter',sans-serif}
  .send{width:44px;height:44px;border-radius:12px;background:#1A2035;border:none;color:#4A5568;font-size:18px;cursor:not-allowed;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
  .send.on{background:#00E5CC;color:#080B12;cursor:pointer}
  .btn-primary{flex:1;padding:13px;background:#00E5CC;color:#080B12;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}
  .btn-sec{padding:13px 16px;background:#1A2035;color:#E8EDF5;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif}
  .typing{display:flex;gap:5px;padding:14px 18px}
  .typing span{width:7px;height:7px;border-radius:50%;background:#4A5568;display:inline-block}
  .typing span:nth-child(1){animation:bounce .8s 0s infinite}
  .typing span:nth-child(2){animation:bounce .8s .15s infinite}
  .typing span:nth-child(3){animation:bounce .8s .3s infinite}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <span style="font-size:24px">🎬</span>
    <div style="flex:1">
      <div style="font-weight:800;font-size:16px">AutoPost AI</div>
      <div id="hsub" style="font-size:10px;color:#4A5568">● Ready — bolo ya type karo</div>
    </div>
    <div id="live" style="display:none;font-size:9px;font-weight:700;color:#22C55E;background:rgba(34,197,94,.12);padding:3px 10px;border-radius:20px;letter-spacing:1px">LIVE</div>
  </div>

  <div class="active-bar" id="abar">
    <div class="dot"></div>
    <div style="flex:1;min-width:0">
      <div style="font-size:10px;font-weight:700;color:#00E5CC">ACTIVE</div>
      <div id="atopic" style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
    </div>
    <button onclick="clearTopic()" style="background:none;border:1px solid #1A2035;border-radius:8px;padding:5px 9px;color:#4A5568;cursor:pointer;font-size:11px">Change</button>
  </div>

  <div class="chat" id="chat"></div>

  <div class="confirm" id="ccard">
    <div style="font-size:10px;font-weight:800;color:#00E5CC;letter-spacing:1.5px;margin-bottom:12px">✅ CONFIRM KARO</div>
    <div id="crow"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn-primary" onclick="doConfirm()">🚀 START POSTING</button>
      <button class="btn-sec" onclick="doEdit()">✏️</button>
    </div>
  </div>

  <div class="chips" id="chips">
    <div class="chip" onclick="send('World Cup 2026 football')">⚽ World Cup</div>
    <div class="chip" onclick="send('IPL Cricket 2026')">🏏 Cricket</div>
    <div class="chip" onclick="send('NBA Basketball')">🏀 NBA</div>
    <div class="chip" onclick="send('Breaking News India')">📰 News</div>
  </div>

  <div class="input-bar">
    <button class="mic" id="micbtn" onclick="toggleMic()">🎙️</button>
    <textarea id="inp" rows="1" placeholder="Topic bolo ya type karo..." oninput="updateSend()" onkeydown="handleKey(event)"></textarea>
    <button class="send" id="sendbtn" onclick="sendInput()">➤</button>
  </div>
</div>

<script>
const SERVER = "";  // same origin — Railway serves both
let msgs = [];
let busy = false;
let pending = null;
let active = null;
let rec = null;
let listening = false;

function t(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}

function addMsg(role, text){
  msgs.push({role,text,time:t()});
  render();
}

function render(){
  const c = document.getElementById("chat");
  c.innerHTML = msgs.map(m => {
    const u = m.role==="user";
    return `<div class="msg ${u?'user':'bot'}">
      <div class="avatar">${u?"👤":"🤖"}</div>
      <div>
        <div class="bubble">${m.text.replace(/\n/g,"<br>")}</div>
        <div class="time">${m.time}</div>
      </div>
    </div>`;
  }).join("");
  c.scrollTop = c.scrollHeight;
}

function showTyping(){
  const c = document.getElementById("chat");
  const d = document.createElement("div");
  d.className="msg bot";d.id="typing";
  d.innerHTML=`<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function hideTyping(){const t=document.getElementById("typing");if(t)t.remove();}

async function send(text){
  const msg = (text||document.getElementById("inp").value).trim();
  if(!msg||busy)return;
  addMsg("user",msg);
  document.getElementById("inp").value="";
  updateSend();
  document.getElementById("chips").style.display="none";
  busy=true;showTyping();

  try{
    const res = await fetch(SERVER+"/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:msgs.filter(m=>m.role!=="system").map(m=>({role:m.role,content:m.text}))})
    });
    const data = await res.json();
    hideTyping();
    addMsg("assistant",data.reply);
    busy=false;

    // Check for confirmation JSON
    const match = data.reply.match(/```json\n([\s\S]*?)\n```/);
    if(match){
      try{
        const cfg = JSON.parse(match[1]);
        if(cfg.confirmed){pending=cfg;showConfirm(cfg);}
      }catch{}
    }
  }catch(e){
    hideTyping();
    addMsg("assistant","❌ Server se connect nahi ho paya. Thodi der mein dobara try karo.");
    busy=false;
  }
}

function sendInput(){send(document.getElementById("inp").value);}

function showConfirm(cfg){
  document.getElementById("crow").innerHTML = [
    ["Topic",cfg.topic],["Caption",cfg.caption],["Posts/Day",""+cfg.posts_per_day]
  ].map(([k,v])=>`<div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:8px"><span style="font-size:11px;color:#4A5568;text-transform:uppercase;flex-shrink:0">${k}</span><span style="font-size:13px;font-weight:600;text-align:right">${v}</span></div>`).join("");
  document.getElementById("ccard").style.display="block";
}

function doConfirm(){
  active=pending;pending=null;
  document.getElementById("ccard").style.display="none";
  document.getElementById("abar").style.display="flex";
  document.getElementById("atopic").textContent=active.topic;
  document.getElementById("live").style.display="block";
  document.getElementById("hsub").textContent="● "+active.topic.slice(0,28);
  
  // Sync to backend
  fetch(SERVER+"/config",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({...active,active:true})
  });
  
  addMsg("assistant","✅ Active ho gaya!\n\n📌 \""+active.topic+"\"\n📅 "+active.posts_per_day+" videos/day\n\nDrive raw_videos mein videos daalo — auto post hongi! 🎯");
}

function doEdit(){
  document.getElementById("ccard").style.display="none";
  document.getElementById("inp").value="Please change: ";
  updateSend();
  document.getElementById("inp").focus();
}

function clearTopic(){
  active=null;
  document.getElementById("abar").style.display="none";
  document.getElementById("live").style.display="none";
  document.getElementById("hsub").textContent="● Ready";
  addMsg("assistant","Topic clear! Naya topic bolo 🔄");
}

function updateSend(){
  const v=document.getElementById("inp").value.trim();
  const b=document.getElementById("sendbtn");
  b.className="send"+(v?" on":"");
}

function handleKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendInput();}}

function toggleMic(){
  if(listening){if(rec)rec.stop();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Chrome use karo");return;}
  rec=new SR();rec.lang="hi-IN";rec.interimResults=false;
  rec.onresult=e=>{
    const t=e.results[0][0].transcript;
    const inp=document.getElementById("inp");
    inp.value=inp.value?inp.value+" "+t:t;
    updateSend();setListening(false);inp.focus();
  };
  rec.onerror=()=>setListening(false);
  rec.onend=()=>setListening(false);
  rec.start();setListening(true);
}

function setListening(on){
  listening=on;
  const b=document.getElementById("micbtn");
  b.className="mic"+(on?" on":"");
  b.textContent=on?"⏹":"🎙️";
}

// Init
addMsg("assistant","Namaste! 👋\n\nKaunsa topic chahiye?\n🎙️ Mic dabao ya neeche se select karo 👇");
</script>
</body>
</html>
